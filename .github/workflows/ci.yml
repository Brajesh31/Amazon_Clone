name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required entry files
        run: |
          test -f index.html
          test -f amazone.css
          test -f amazone.js

      - name: Validate JavaScript syntax
        run: node --check amazone.js

      - name: Run JavaScript tests
        run: node --test tests/*.test.js

      - name: Validate HTML structure and local asset references
        run: python scripts/check_html.py
