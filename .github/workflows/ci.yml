name: Static site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required browser entry files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s amazone.css
          test -s amazone.js

      - name: Validate JavaScript syntax
        run: node --check amazone.js

      - name: Run dependency-free JavaScript tests
        run: node --test tests/*.test.js

      - name: Validate HTML structure and local references
        run: python scripts/check_html.py

      - name: Validate local Markdown links and documentation structure
        run: python scripts/check_docs.py
