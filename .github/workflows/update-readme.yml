name: Update README Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-metadata
  cancel-in-progress: false

jobs:
  update-readme:
    name: Refresh README review date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update README review date
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +"%Y-%m-%d")"
          MARKER="Documentation review date: ${DATE}"

          if grep -q "^Documentation review date:" README.md; then
            sed -i "s/^Documentation review date:.*/${MARKER}/" README.md
          else
            printf "\\n%s\\n" "$MARKER" >> README.md
          fi

      - name: Commit metadata change when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README review date is already current."
            exit 0
          fi

          git commit -m "chore: refresh README review date"
          git push
