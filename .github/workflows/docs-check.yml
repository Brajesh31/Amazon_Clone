name: Documentation quality checks

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Validate Markdown documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Markdown files and local links
        run: python scripts/check_docs.py

      - name: Confirm documentation entry point
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/README.md
          grep -Fq "docs/README.md" README.md
